# Single entry point: routes /api and /ws to the backend replicas and everything else to the frontend.
# The same file runs in every environment; anything environment-specific (TLS, extra servers) is mounted
# into /etc/nginx/extra/ and included below.

# Docker's embedded DNS. With "resolve", nginx re-resolves the service names, so it follows replicas as
# they are scaled or recreated instead of keeping the IPs it saw at startup.
resolver 127.0.0.11 valid=10s;

upstream backend {
    zone backend 64k;
    server backend:8080 resolve;
}

upstream frontend {
    zone frontend 64k;
    server frontend:3000 resolve;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Keep the scheme set by a TLS proxy in front (e.g. Cloudflare); otherwise use this connection's own
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $forwarded_proto;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $connection_upgrade;

server {
    listen 3000;
    include /etc/nginx/extra/*.conf;

    location /api/ {
        proxy_pass http://backend;
    }

    location /ws {
        proxy_pass http://backend;
        # Keep idle game WebSockets open (STOMP heartbeats also keep them alive)
        proxy_read_timeout 1h;
    }

    location / {
        proxy_pass http://frontend;
    }
}

# Direct backend access for API tools, Swagger UI and health checks. Publish this port in development only.
server {
    listen 8080;

    location / {
        proxy_pass http://backend;
        proxy_read_timeout 1h;
    }
}
