services:
  db:
    container_name: chess-db
    hostname: db
    image: postgres:17.5
    ports:
      - "5432:5432"
    networks:
      - backend
    volumes:
      - ./docker/volumes/postgres-dev:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: password
      POSTGRES_DB: chessdb
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U root -d chessdb" ]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 20s

  redis:
    container_name: chess-redis
    hostname: redis
    image: redis:8.6
    ports:
      - "6379:6379"
    networks:
      - backend
    volumes:
      - ./docker/volumes/redis-dev:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 10s

  flyway:
    container_name: chess-flyway
    image: flyway/flyway:11.19
    command: migrate
    restart: "no"
    networks:
      - backend
    volumes:
      - ./backend/src/main/resources/db/migrations:/flyway/sql:ro
    environment:
      FLYWAY_URL: jdbc:postgresql://db:5432/chessdb
      FLYWAY_USER: root
      FLYWAY_PASSWORD: password
      FLYWAY_LOCATIONS: filesystem:/flyway/sql
    depends_on:
      db:
        condition: service_healthy

  rabbitmq:
    container_name: chess-rabbitmq
    hostname: rabbitmq
    image: rabbitmq:4.1-management
    ports:
      - "61613:61613" # STOMP
      - "15672:15672" # management UI
    networks:
      - backend
    environment:
      RABBITMQ_DEFAULT_USER: chess
      RABBITMQ_DEFAULT_PASS: password
    configs:
      - source: rabbitmq-plugins
        target: /etc/rabbitmq/enabled_plugins
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity" ]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 20s

  # Several identical instances; logins live in Redis and WebSocket messages go through RabbitMQ,
  # so any instance can serve any request
  backend:
    build:
      context: ./backend
    deploy:
      replicas: 2
    networks:
      - backend
    environment:
      APP_WEBSOCKET_RELAY_ENABLED: "true"
      APP_WEBSOCKET_RELAY_HOST: rabbitmq
      APP_WEBSOCKET_RELAY_LOGIN: chess
      APP_WEBSOCKET_RELAY_PASSCODE: password
    healthcheck:
      test: [ "CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/actuator/health" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      flyway:
        condition: service_completed_successfully

  # Single entry point: / goes to the frontend, /api and /ws to the backend replicas
  gateway:
    container_name: chess-gateway
    hostname: gateway
    image: nginxinc/nginx-unprivileged:1.29-alpine
    ports:
      - "3000:3000" # application
      - "8080:8080" # direct backend access (API tools, Swagger UI, health)
    networks:
      - backend
      - frontend
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started

  frontend:
    container_name: chess-frontend
    hostname: frontend
    build:
      context: ./frontend
    networks:
      - frontend

networks:
  backend:
    driver: bridge
  frontend:
    driver: bridge

configs:
  rabbitmq-plugins:
    content: |
      [rabbitmq_management,rabbitmq_stomp].
