services:
  db:
    container_name: chess-db
    hostname: db
    image: postgres:17.5
    ports:
      - "5432:5432"
    networks:
      - backend
    volumes:
      - ./docker/volumes/postgres-dev:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: password
      POSTGRES_DB: chessdb
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U root -d chessdb" ]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 20s

  redis:
    container_name: chess-redis
    hostname: redis
    image: redis:8.6
    ports:
      - "6379:6379"
    networks:
      - backend
    volumes:
      - ./docker/volumes/redis-dev:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 10s

  flyway:
    container_name: chess-flyway
    image: flyway/flyway:11.19
    command: migrate
    restart: "no"
    networks:
      - backend
    volumes:
      - ./backend/src/main/resources/db/migrations:/flyway/sql:ro
    environment:
      FLYWAY_URL: jdbc:postgresql://db:5432/chessdb
      FLYWAY_USER: root
      FLYWAY_PASSWORD: password
      FLYWAY_LOCATIONS: filesystem:/flyway/sql
    depends_on:
      db:
        condition: service_healthy

  backend:
    container_name: chess-backend
    hostname: backend
    build:
      context: ./backend
    ports:
      - "8080:8080"
    networks:
      - backend
      - frontend
    healthcheck:
      test: [ "CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/actuator/health" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      flyway:
        condition: service_completed_successfully

  frontend:
    container_name: chess-frontend
    hostname: frontend
    build:
      context: ./frontend
    ports:
      - "3000:3000"
    networks:
      - frontend
    depends_on:
      backend:
        condition: service_healthy

networks:
  backend:
    driver: bridge
  frontend:
    driver: bridge
