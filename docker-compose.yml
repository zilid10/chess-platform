services:
  db:
    container_name: chess-db
    hostname: db
    image: postgres:17.5
    ports:
      - "5432:5432"
    networks:
      - backend
    volumes:
      - ./docker/volumes/postgres-dev:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: password
      POSTGRES_DB: chessdb
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U root -d chessdb" ]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 20s

  redis:
    container_name: chess-redis
    hostname: redis
    image: redis:8.6
    ports:
      - "6379:6379"
    networks:
      - backend
    volumes:
      - ./docker/volumes/redis-dev:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 10s

  flyway:
    container_name: chess-flyway
    image: flyway/flyway:11.19
    command: migrate
    restart: "no"
    networks:
      - backend
    volumes:
      - ./backend/src/main/resources/db/migrations:/flyway/sql:ro
    environment:
      FLYWAY_URL: jdbc:postgresql://db:5432/chessdb
      FLYWAY_USER: root
      FLYWAY_PASSWORD: password
      FLYWAY_LOCATIONS: filesystem:/flyway/sql
    depends_on:
      db:
        condition: service_healthy

  rabbitmq:
    container_name: chess-rabbitmq
    hostname: rabbitmq
    image: rabbitmq:4.1-management
    ports:
      - "61613:61613" # STOMP
      - "15672:15672" # management UI
    networks:
      - backend
    environment:
      RABBITMQ_DEFAULT_USER: chess
      RABBITMQ_DEFAULT_PASS: password
    configs:
      - source: rabbitmq-plugins
        target: /etc/rabbitmq/enabled_plugins
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity" ]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 20s

  # Several identical instances; logins live in Redis and WebSocket messages go through RabbitMQ,
  # so any instance can serve any request
  backend:
    build:
      context: ./backend
    deploy:
      replicas: 2
    networks:
      - backend
    environment:
      APP_WEBSOCKET_RELAY_ENABLED: "true"
      APP_WEBSOCKET_RELAY_HOST: rabbitmq
      APP_WEBSOCKET_RELAY_LOGIN: chess
      APP_WEBSOCKET_RELAY_PASSCODE: password
      # Off unless .env turns it on; run with --profile observability so Alloy is there to receive
      OTEL_EXPORT_ENABLED: ${OTEL_EXPORT_ENABLED:-false}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://alloy:4318
    healthcheck:
      test: [ "CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/actuator/health" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      flyway:
        condition: service_completed_successfully

  alloy:
    container_name: chess-alloy
    hostname: alloy
    image: grafana/alloy:v1.20.1
    profiles:
      - observability
    command: [ "run", "/etc/alloy/config.alloy", "--server.http.listen-addr=0.0.0.0:12345" ]
    ports:
      - "12345:12345"
    networks:
      - backend
    configs:
      - source: alloy
        target: /etc/alloy/config.alloy
    environment:
      GRAFANA_CLOUD_OTLP_ENDPOINT: ${GRAFANA_CLOUD_OTLP_ENDPOINT:-}
      GRAFANA_CLOUD_INSTANCE_ID: ${GRAFANA_CLOUD_INSTANCE_ID:-}
      GRAFANA_CLOUD_API_KEY: ${GRAFANA_CLOUD_API_KEY:-}

  backend-lb:
    container_name: chess-backend-lb
    hostname: backend-lb
    image: nginx:1.29-alpine
    ports:
      - "8080:8080"
    networks:
      - backend
      - frontend
    configs:
      - source: backend-lb
        target: /etc/nginx/conf.d/default.conf
    depends_on:
      backend:
        condition: service_healthy

  frontend:
    container_name: chess-frontend
    hostname: frontend
    build:
      context: ./frontend
    ports:
      - "3000:3000"
    networks:
      - frontend
    depends_on:
      - backend-lb

networks:
  backend:
    driver: bridge
  frontend:
    driver: bridge

configs:
  rabbitmq-plugins:
    content: |
      [rabbitmq_management,rabbitmq_stomp].
  alloy:
    content: |
      // The backend sends OTLP here; only Alloy holds the Grafana Cloud credentials
      otelcol.receiver.otlp "default" {
        http {
          endpoint = "0.0.0.0:4318"
        }
        output {
          metrics = [otelcol.processor.batch.default.input]
          logs    = [otelcol.processor.batch.default.input]
          traces  = [otelcol.processor.batch.default.input]
        }
      }

      otelcol.processor.batch "default" {
        output {
          metrics = [otelcol.exporter.otlphttp.grafana_cloud.input]
          logs    = [otelcol.exporter.otlphttp.grafana_cloud.input]
          traces  = [otelcol.exporter.otlphttp.grafana_cloud.input]
        }
      }

      otelcol.auth.basic "grafana_cloud" {
        username = sys.env("GRAFANA_CLOUD_INSTANCE_ID")
        password = sys.env("GRAFANA_CLOUD_API_KEY")
      }

      otelcol.exporter.otlphttp "grafana_cloud" {
        client {
          endpoint = sys.env("GRAFANA_CLOUD_OTLP_ENDPOINT")
          auth     = otelcol.auth.basic.grafana_cloud.handler
        }
      }
  backend-lb:
    content: |
      # nginx resolves "backend" to every replica at startup and balances round-robin between them
      upstream backend {
          server backend:8080;
      }

      map $$http_upgrade $$connection_upgrade {
          default upgrade;
          ''      close;
      }

      server {
          listen 8080;

          location / {
              proxy_pass http://backend;
              proxy_http_version 1.1;
              proxy_set_header Host $$host;
              proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
              proxy_set_header Upgrade $$http_upgrade;
              proxy_set_header Connection $$connection_upgrade;
              # Keep idle game WebSockets open (STOMP heartbeats also keep them alive)
              proxy_read_timeout 1h;
          }
      }
