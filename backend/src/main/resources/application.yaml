spring:
  application:
    name: chess-platform
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    hikari:
      maximum-pool-size: 10
  threads:
    virtual:
      enabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  main:
    banner-mode: "off"

management:
  tracing:
    sampling:
      # Keep every trace at this traffic level; lower it when volume grows
      probability: 1.0
    export:
      otlp:
        enabled: ${OTEL_EXPORT_ENABLED:false}
  logging:
    export:
      otlp:
        enabled: ${OTEL_EXPORT_ENABLED:false}
  otlp:
    metrics:
      export:
        enabled: ${OTEL_EXPORT_ENABLED:false}
        url: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/metrics
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/traces
    logging:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/logs

server:
  port: ${SERVER_PORT:8080}
  address: ${SERVER_ADDRESS:0.0.0.0}
  servlet:
    session:
      cookie:
        # Spring Session would otherwise name it SESSION
        name: JSESSIONID

app:
  allowed-origins: ${APP_ALLOWED_ORIGINS:http://localhost:3000,http://frontend:3000}
  websocket:
    relay:
      # Required when running more than one backend instance
      enabled: ${APP_WEBSOCKET_RELAY_ENABLED:false}
      host: ${APP_WEBSOCKET_RELAY_HOST:rabbitmq}
      port: ${APP_WEBSOCKET_RELAY_PORT:61613}
      login: ${APP_WEBSOCKET_RELAY_LOGIN:guest}
      passcode: ${APP_WEBSOCKET_RELAY_PASSCODE:guest}
