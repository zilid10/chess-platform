# Debugging features for local development. Connection settings come from the environment (compose.yaml).
spring:
  jpa:
    show-sql: true

management:
  endpoints:
    web:
      exposure:
        include: "*"

springdoc:
  swagger-ui:
    enabled: true
  api-docs:
    enabled: true

logging:
  level:
    root: info
    me.zilid.chessplatform: debug
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace
