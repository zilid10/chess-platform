# database settings
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://db:5432/chessdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:password}
# redis settings
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:redis}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}
# actuator settings
management.server.port=${MANAGEMENT_SERVER_PORT:8080}
management.endpoints.web.exposure.include=*
# openAPI settings
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true
# logging settings
logging.level.root=info
logging.level.me.zilid.chessplatform=debug

